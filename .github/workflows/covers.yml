name: Fetch covers

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-download covers that already exist"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [data/covers.json, scripts/fetch_covers.py]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/fetch_covers.py ${{ inputs.force && '--force' || '' }}
      - name: Commit covers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add assets/covers
          git diff --cached --quiet || git commit -m "Update covers" && git push
